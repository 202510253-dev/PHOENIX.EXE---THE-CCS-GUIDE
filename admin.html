<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Phoenix Guide CCS</title>
    <link rel="icon" type="image/png" href="images/ccs_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a1f1a;
            background-image: linear-gradient(145deg, #071510 0%, #0c2a1e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .login-container {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .login-header {
            background: #1a472a;
            padding: 28px 24px 20px;
            text-align: center;
            border-bottom: 1px solid #e0c87c;
        }

        .ccs-logo {
            width: 90px;
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f5e7b2;
            letter-spacing: 1px;
        }

        .login-header p {
            font-size: 0.8rem;
            color: #d4c27a;
        }

        .login-form {
            padding: 32px 32px 24px;
            background: white;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #2c5a3b;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            font-size: 0.95rem;
            border: 1px solid #cfd9d4;
            border-radius: 8px;
            transition: 0.2s;
            font-family: 'Poppins', sans-serif;
        }

        .input-group input:focus {
            outline: none;
            border-color: #c99f2e;
            box-shadow: 0 0 0 2px rgba(201, 159, 46, 0.2);
        }

        .btn-login {
            width: 100%;
            background: #1a472a;
            border: none;
            padding: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #f5e7b2;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 8px;
            font-family: 'Poppins', sans-serif;
        }

        .btn-login:hover {
            background: #c99f2e;
            color: #1a2a1a;
        }

        .login-footer-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 0.75rem;
        }

        .login-footer-links a {
            color: #2c5a3b;
            text-decoration: none;
            font-weight: 500;
        }

        .login-footer-links a:hover {
            color: #c99f2e;
            text-decoration: underline;
        }

        .privacy-note {
            font-size: 0.68rem;
            color: #6b7c6f;
            text-align: center;
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid #e2e8e4;
            line-height: 1.45;
        }

        .error-msg {
            background: #ffefcf;
            color: #b1620e;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.8rem;
            display: none;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <img src="images/phlogo.png" alt="CCS Logo" class="ccs-logo">
            <h1>College of Computer Studies</h1>
            <p>Admin Portal · Phoenix Guide</p>
        </div>
        <div class="login-form">
            <div id="loginError" class="error-msg">❌ Invalid email or password. Use admin@gordoncollege.edu.ph /
                phoenix2026</div>
            <div class="input-group">
                <label>Email address *</label>
                <input type="email" id="adminEmail" placeholder="admin@gordoncollege.edu.ph">
            </div>
            <div class="input-group">
                <label>Password *</label>
                <input type="password" id="adminPassword" placeholder="Enter your password">
            </div>
            <button class="btn-login" id="loginBtn">Login</button>
            <div class="login-footer-links">
                <a href="#">Sign Up</a>
                <a href="#">Forgot Password?</a>
            </div>
            <div class="privacy-note">
                By clicking the login button, you recognize the authority of Gordon College CCS to process your
                information.
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = document.getElementById('adminEmail').value.trim();
            const pass = document.getElementById('adminPassword').value.trim();
            // Demo credentials
            if (email === 'admin@gordoncollege.edu.ph' && pass === 'phoenix2026') {
                // Set a session flag to mark admin as logged in
                sessionStorage.setItem('adminLoggedIn', 'true');
                // Redirect to main page
                window.location.href = 'index.html';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        });
    </script>
</body>

</html>
